[project]
name = "todolist"
version = "0.1.0"
description = "Simple todo list tracker"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "sqlmodel (>=0.0.31,<0.0.32)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (<5.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    #    "mypy (>=1.19.1,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "aiofiles (==23.2.1)",
    "pillow (==10.4.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "pywebpush (>=2.3.0,<3.0.0)",
    "clamav-client (==0.7.2)",
    "python-magic (>=0.4.27,<0.5.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "types-python-dateutil (>=2.9.0.20260124,<3.0.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-dotenv (>=0.5.2,<0.6.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "types-PyYAML",
    "types-passlib",
    "types-python-jose",
    "types-ujson",
    "types-greenlet"
]
