services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todolist_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d todolist_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: minio_server
    command: server /data --console-address ":9001"
    environment:
      MINIO_SERVER_URL: http://localhost:9000
      MINIO_ROOT_USER: miniouser
      MINIO_ROOT_PASSWORD: miniopassword
      MINIO_EXPIRES: 15
      MINIO_BUCKET: test-bucket
      MINIO_REGION: us-east-1
    ports:
      - "9000:9000" #API
      - "9001:9001" #Console
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

  api:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/todolist_db
      - MINIO_INTERNAL_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_REGION=${MINIO_REGION}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=test-bucket
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
      - ./static:/app/static

  celery:
    build: .
    command: celery -A celery_config.celery_app worker --loglevel=INFO
    depends_on:
      db:
          condition: service_healthy
      redis:
          condition: service_healthy
      clamav:
          condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/todolist_db
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY} # equal MINIO_ROOT_USER: miniouser
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY} # equal MINIO_ROOT_PASSWORD: miniopassword
      - MINIO_BUCKET=test-bucket
      - MINIO_REGION=${MINIO_REGION}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app

  celery_beat:
    build: .
    command: celery -A celery_config.celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    depends_on:
      - redis
      - db
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/todolist_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app

  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - FRESHCLAM_CHECKS=24
      - FRESHCLAM_CUSTOM_CONFIG=PrivateMirror http://pivotal-clamav-mirror.s3.amazonaws.com
    volumes:
      - clamav-db:/var/lib/clamav
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc localhost 3310 | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav-db:
