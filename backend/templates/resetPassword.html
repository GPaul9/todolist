<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Сброс пароля</title>
</head>

<body style="margin:0;padding:0;background:#f6f8f9;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f6f8f9;">
    <tr>
      <td align="center" style="padding:40px 12px;">

        <!-- card -->
        <table width="600" cellpadding="0" cellspacing="0" border="0"
          style="width:100%;max-width:600px;background:#ffffff;border-radius:16px;
          box-shadow:0 10px 30px rgba(31,60,136,0.08); overflow:hidden;">

          <!-- top accent bar -->
          <tr>
            <td style="height:6px;background:linear-gradient(90deg,#2867cd,#8bbfff);"></td>
          </tr>

          <!-- content -->
          <tr>
            <td style="padding:40px;font-family:Arial,Helvetica,sans-serif;">

              <!-- brand -->
              <div style="font-size:20px;font-weight:800;letter-spacing:2px;color:#3c7be1;margin-bottom:24px;">
                TODOLIST
              </div>

              <!-- title -->
              <div style="font-size:22px;font-weight:700;color:#1f1f23;margin-bottom:12px;">
                Сброс пароля
              </div>

              <!-- intro -->
              <div style="font-size:14px;color:#1f1f23;line-height:1.6;margin-bottom:10px;">
                Мы получили запрос на сброс пароля для вашего аккаунта.
              </div>

              <div style="font-size:14px;color:#1f1f23;line-height:1.6;margin-bottom:28px;">
                Если это были вы — нажмите кнопку ниже, чтобы задать новый пароль.
              </div>

              <!-- info box -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0"
                style="background:#f1f6fc;border-radius:12px;margin-bottom:28px;">
                <tr>
                  <td style="padding:16px 18px;font-size:13px;color:#757575;line-height:1.6;">
                    🔒 Ссылка действительна <b>1 час</b><br/>
                  </td>
                </tr>
              </table>

              <!-- button -->
              <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
                <tr>
                  <td bgcolor="#3c7be1" style="background:#3c7be1;border-radius:12px;">
                    <a href="{{ reset_url }}"
                       style="display:inline-block;padding:14px 28px;
                       font-size:14px;font-family:Arial,Helvetica,sans-serif;
                       color:#ffffff;text-decoration:none;font-weight:700;
                       border-radius:12px;">
                      Сбросить пароль
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td style="padding:20px 40px 30px 40px;font-family:Arial,Helvetica,sans-serif;
              font-size:12px;color:#9e9e9e;text-align:center;line-height:1.6;">
              Если вы не запрашивали сброс пароля — игнорируйте это письмо.
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
