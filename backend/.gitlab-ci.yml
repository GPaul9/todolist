stages:
  - lint

lint:
  stage: lint
  image: python:3.13-slim
  before_script:
    - pip install --no-cache-dir ruff black isort mypy types-all
  script:
    - ruff check .
    - black --check .
    - isort --check-only .
    - mypy .
  cache:
    key: "${CI_COMMIT_REF_SLUG}-mypy"
    paths:
      - .mypy_cache/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"  
  allow_failure: false

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "main"
